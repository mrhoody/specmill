# @specmill/spec-buddy bundle layer: the core plugin, the Slack provider, and the agent preset every Spec Buddy Session
# runs under. The profile supplies `stateDir`, the GitHub settings, the checkout, and the Slack tokens; see the plugin
# README and examples/profile.cordis.patch.yml.
- insert:
    - id: spec-buddy
      name: '@specmill/spec-buddy'
    - id: spec-buddy-slack
      name: '@specmill/spec-buddy/slack-watch'
    # The agent preset of every Spec Buddy conversation Session (BUDDY_PRESET in src/conversations.ts). It reads, searches,
    # fetches pages, uses the spec-writing skill, and talks; it has no shell, jobs, subagents, writes, plan mode, scheduling,
    # questions to a person, presenting, or plugin management. Its only side effects are spec_draft,
    # spec_request_approval, and spec_handoff, which the core registers on each Session.
    - id: preset-specmill-spec-buddy
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: specmill-spec-buddy
        name: Spec Buddy
        description: Spec Buddy's planning Sessions. Reads the repository and the web, drafts specs, and asks for approval; never writes code.
        order: 92
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are Spec Buddy, a planning partner. You read and talk; you never implement.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
